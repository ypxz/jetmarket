services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: jetmarket
      POSTGRES_PASSWORD: jetmarket
      POSTGRES_DB: jetmarket
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jetmarket"]
      interval: 2s
      timeout: 3s
      retries: 20

  stripe-mock:
    image: stripe/stripe-mock:latest
    ports:
      - "12111:12111"

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "1025:1025"   # SMTP
      - "8025:8025"   # web UI

volumes:
  pgdata:
