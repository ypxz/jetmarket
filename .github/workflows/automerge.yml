name: automerge

# Squash-merges PRs carrying the `automerge` label once all checks are green.
# Fallback if this cannot merge: lead pushes `git push origin HEAD:main`.

on:
  pull_request:
    types: [labeled, synchronize, opened, reopened]
  check_suite:
    types: [completed]
  workflow_run:
    workflows: [ci]
    types: [completed]

permissions:
  contents: write
  pull-requests: write
  checks: read

jobs:
  merge:
    runs-on: ubuntu-latest
    if: github.event.pull_request.labels[0] != null || github.event_name != 'pull_request'
    steps:
      - name: Merge automerge-labelled green PRs
        uses: actions/github-script@v7
        with:
          script: |
            const { data: prs } = await github.rest.pulls.list({
              owner: context.repo.owner, repo: context.repo.repo, state: 'open',
            });
            for (const pr of prs) {
              if (!pr.labels.some(l => l.name === 'automerge')) continue;
              const { data: checks } = await github.rest.checks.listForRef({
                owner: context.repo.owner, repo: context.repo.repo, ref: pr.head.sha,
              });
              if (!checks.check_runs.length) continue;
              const pending = checks.check_runs.some(c => c.status !== 'completed');
              const failing = checks.check_runs.some(c =>
                ['failure', 'cancelled', 'timed_out', 'action_required'].includes(c.conclusion));
              if (pending || failing) continue;
              const { data: full } = await github.rest.pulls.get({
                owner: context.repo.owner, repo: context.repo.repo, pull_number: pr.number,
              });
              if (full.mergeable === false) continue;
              await github.rest.pulls.merge({
                owner: context.repo.owner, repo: context.repo.repo, pull_number: pr.number,
                merge_method: 'squash',
              });
              await github.rest.git.deleteRef({
                owner: context.repo.owner, repo: context.repo.repo, ref: `heads/${pr.head.ref}`,
              }).catch(() => {});
              core.info(`merged #${pr.number}`);
            }
