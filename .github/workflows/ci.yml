name: ci

on:
  workflow_dispatch:
  # Automatic push/PR triggers disabled 2026-10-03 (user directive): the org's
  # GitHub Actions spend limit is exhausted, so every run failed in ~3s anyway.
  # Local verification (lint/typecheck/unit/e2e) still gates every push.
  # To restore CI: raise the Actions spend limit in GitHub org billing, then
  # restore: push {branches: [main]}, pull_request, check_suite/workflow_run.

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-typecheck-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm i --frozen-lockfile || pnpm i
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test

  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: jetmarket
          POSTGRES_PASSWORD: jetmarket
          POSTGRES_DB: jetmarket
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U jetmarket"
          --health-interval 2s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgres://jetmarket:jetmarket@localhost:5432/jetmarket
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm i --frozen-lockfile || pnpm i
      - run: pnpm -r --if-present migrate
      - run: pnpm check:schema
      - run: pnpm -r --if-present test:integration

  contract:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgres://jetmarket:jetmarket@localhost:5432/jetmarket
      STRIPE_API_BASE: http://localhost:12111
      MAILPIT_API_URL: http://localhost:8025
      SMTP_URL: smtp://localhost:1025
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm i --frozen-lockfile || pnpm i
      - name: compose services (stripe-mock, mailpit, postgres)
        run: docker compose up -d --wait postgres stripe-mock mailpit
      - run: pnpm -r --if-present test:contract

  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: jetmarket
          POSTGRES_PASSWORD: jetmarket
          POSTGRES_DB: jetmarket
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U jetmarket"
          --health-interval 2s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgres://jetmarket:jetmarket@localhost:5432/jetmarket
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm i --frozen-lockfile || pnpm i
      - run: pnpm --filter @jetmarket/web build || pnpm -r --if-present build
      - name: playwright install (only when tests-e2e provides it)
        run: |
          if pnpm --filter @jetmarket/tests-e2e exec playwright --version >/dev/null 2>&1; then
            pnpm --filter @jetmarket/tests-e2e exec playwright install --with-deps chromium
          else
            echo "tests-e2e has no playwright yet — skipping browser install"
          fi
      - run: pnpm -r --if-present test:e2e
      # Second acceptance loop (spec): same suite against VERTICAL=machinery on
      # a second port — the machinery project self-skips under jets.
      - name: e2e VERTICAL=machinery
        run: E2E_PORT=3100 pnpm --filter @jetmarket/tests-e2e test:e2e:machinery
        env:
          # Must end in _test — the e2e guard refuses non-test DB names.
          TEST_DATABASE_URL: postgres://jetmarket:jetmarket@localhost:5432/jetmarket_machinery_test
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: playwright-report
          path: tests-e2e/playwright-report/
          retention-days: 7
